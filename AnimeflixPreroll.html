<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIMEFLIX</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #000000;
            overflow: hidden;
        }

        #preroll {
            position: fixed;
            inset: 0;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            perspective: 900px;
        }

        .stage {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-style: preserve-3d;
        }

        /* Very slightly snappier 1.45s Z-axis glide */
        .logo-z-track {
            position: relative;
            z-index: 2;
            transform: translate3d(0, 0, -520px);
            transform-style: preserve-3d;
            will-change: transform;
            animation: logoZMove 1.45s cubic-bezier(0.2, 0.8, 0.3, 1) 0.15s forwards;
        }

        .logo-rig {
            position: relative;
            transform: translateY(6px) scaleY(1.17);
        }

        #logo-canvas {
            width: 300px;
            max-width: 70vw;
            height: auto;
            display: block;
        }

        /* Clears completely during the first 50% (0.72s) */
        .stage-beam-shadow {
            position: absolute;
            inset: -10px -20px;
            pointer-events: none;
            background: radial-gradient(ellipse 55% 95% at 50% 45%,
                    rgba(0, 0, 0, 0.78) 0%,
                    rgba(0, 0, 0, 0.85) 55%,
                    rgba(0, 0, 0, 0.92) 100%);
            transform: scale(0.85);
            opacity: 1;
            will-change: transform, opacity;
            animation: beamSweepOpen 0.72s ease-out 0.15s forwards;
        }

        /* Layer 2: Stage light & shadow */
        .floor-surface {
            position: relative;
            z-index: 1;
            width: 740px;
            max-width: 96vw;
            height: 92px;
            margin-top: -12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .floor-top-light {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(50% 90% at 50% 85%,
                    rgba(255, 255, 255, 0.125) 0%,
                    rgba(255, 255, 255, 0.085) 42%,
                    rgba(255, 255, 255, 0.035) 70%,
                    rgba(255, 255, 255, 0.009) 86%,
                    rgba(0, 0, 0, 0) 96%);
            filter: blur(8px);
        }

        .floor-bottom-light {
            position: absolute;
            top: 53px;
            width: 600px;
            max-width: 88vw;
            height: 30px;
            border-radius: 50%;
            background: radial-gradient(50% 75% at 50% 25%,
                    rgba(255, 255, 255, 0.065) 0%,
                    rgba(255, 255, 255, 0.03) 55%,
                    rgba(255, 255, 255, 0.008) 78%,
                    rgba(0, 0, 0, 0) 94%);
            filter: blur(6px);
        }

        /* Shadow synced 1:1 with the 1.45s curve and 0.72s reveal */
        .logo-cast-shadow {
            position: absolute;
            top: 52px;
            width: 204px;
            max-width: 46vw;
            height: 4px;
            border-radius: 50%;
            background: radial-gradient(ellipse at center,
                    rgba(0, 0, 0, 0.94) 0%,
                    rgba(0, 0, 0, 0.78) 45%,
                    rgba(0, 0, 0, 0.28) 68%,
                    rgba(0, 0, 0, 0) 84%);
            opacity: 0.45;
            transform: scaleX(0.46) scaleY(0.6);
            filter: blur(3.2px);
            will-change: transform, opacity, filter;
            animation:
                shadowScaleZ 1.45s cubic-bezier(0.2, 0.8, 0.3, 1) 0.15s forwards,
                shadowFadeReveal 0.72s ease-out 0.15s forwards;
        }

        @keyframes logoZMove {
            0% {
                transform: translate3d(0, 0, -520px);
            }

            100% {
                transform: translate3d(0, 0, 0px);
            }
        }

        @keyframes beamSweepOpen {
            0% {
                transform: scale(0.85);
                opacity: 1;
            }

            100% {
                transform: scale(2.8);
                opacity: 0;
            }
        }

        @keyframes shadowScaleZ {
            0% {
                transform: scaleX(0.46) scaleY(0.6);
                filter: blur(3.2px);
            }

            100% {
                transform: scaleX(1) scaleY(1);
                filter: blur(1.5px);
            }
        }

        @keyframes shadowFadeReveal {
            0% {
                opacity: 0.45;
            }

            100% {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div id="preroll">
        <div class="stage">
            <div class="logo-z-track">
                <div class="logo-rig">
                    <canvas id="logo-canvas" width="600" height="150" aria-label="ANIMEFLIX"></canvas>
                    <div class="stage-beam-shadow"></div>
                </div>
            </div>

            <div class="floor-surface">
                <div class="floor-top-light"></div>
                <div class="floor-bottom-light"></div>
                <div class="logo-cast-shadow"></div>
            </div>
        </div>
    </div>

    <script>
        function renderNetflixLogo() {
            const canvas = document.getElementById("logo-canvas");
            const ctx = canvas.getContext("2d");
            const w = canvas.width;
            const h = canvas.height;

            const off = document.createElement("canvas");
            off.width = w;
            off.height = h;
            const octx = off.getContext("2d");

            octx.fillStyle = "#E50914";
            octx.font = "128px 'Bebas Neue', Impact, sans-serif";
            octx.textAlign = "center";
            octx.textBaseline = "alphabetic";
            if ("letterSpacing" in octx) {
                octx.letterSpacing = "4px";
            }
            octx.fillText("ANIMEFLIX", w / 2, 125);

            const src = octx.getImageData(0, 0, w, h).data;
            let minX = w, maxX = 0, minY = h, maxY = 0;
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    if (src[(y * w + x) * 4 + 3] > 0) {
                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                        if (y < minY) minY = y;
                        if (y > maxY) maxY = y;
                    }
                }
            }

            minX = Math.max(0, minX - 2);
            maxX = Math.min(w - 1, maxX + 2);
            minY = Math.max(0, minY - 2);
            maxY = Math.min(h - 1, maxY + 2);

            const textW = maxX - minX;
            const textH = maxY - minY;
            if (textW <= 0 || textH <= 0) return;

            const centerX = minX + textW / 2;
            const halfW = textW / 2;
            const archLift = 18.5;
            const barrelStretch = 1.045;

            const outImg = ctx.createImageData(w, h);
            const dst = outImg.data;

            for (let dy = Math.floor(minY); dy <= Math.ceil(maxY); dy++) {
                for (let dx = Math.floor(minX - 6); dx <= Math.ceil(maxX + 6); dx++) {
                    if (dx < 0 || dx >= w) continue;

                    const warpedNorm = (dx - centerX) / halfW;
                    let norm = warpedNorm * barrelStretch;
                    norm = norm - (barrelStretch - 1) * (norm * norm * norm);
                    const sx = centerX + norm * halfW;

                    if (sx < minX || sx > maxX) continue;

                    const lift = archLift * (1 - norm * norm);
                    const destH = textH - lift;
                    if (destH <= 0) continue;

                    const sy = minY + ((dy - minY) / destH) * textH;
                    if (sy < minY || sy > maxY) continue;

                    const x0 = Math.floor(sx);
                    const y0 = Math.floor(sy);
                    const x1 = Math.min(w - 1, x0 + 1);
                    const y1 = Math.min(h - 1, y0 + 1);
                    const fx = sx - x0;
                    const fy = sy - y0;

                    const a00 = src[(y0 * w + x0) * 4 + 3];
                    const a10 = src[(y0 * w + x1) * 4 + 3];
                    const a01 = src[(y1 * w + x0) * 4 + 3];
                    const a11 = src[(y1 * w + x1) * 4 + 3];

                    const alpha =
                        a00 * (1 - fx) * (1 - fy) +
                        a10 * fx * (1 - fy) +
                        a01 * (1 - fx) * fy +
                        a11 * fx * fy;

                    if (alpha > 0.5) {
                        const idx = (dy * w + dx) * 4;
                        dst[idx] = 229;
                        dst[idx + 1] = 9;
                        dst[idx + 2] = 20;
                        dst[idx + 3] = Math.round(alpha);
                    }
                }
            }

            ctx.putImageData(outImg, 0, 0);
        }

        renderNetflixLogo();
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(renderNetflixLogo);
        }
        window.addEventListener("load", renderNetflixLogo);
    </script>
</body>

</html>
